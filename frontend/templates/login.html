<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="row justify-content-center mt-5 g-0">
      <div class="col-xl-3 col-lg-6 col-md-8">
        <div class="card p-4 border shadow-sm">
          <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-lock text-primary me-2"></i>Sign In</h3>
          <div id="loginAlert" class="alert alert-danger d-none py-2 small"></div>
          <form id="loginForm" class="smart-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email address</label>
              <input type="email" id="loginEmail" class="form-control" required placeholder="Enter Your Email" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" id="loginPassword" class="form-control" required placeholder="Enter password" />
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3 submit-lock-btn">Sign In</button>
            <div class="text-center small text-muted">Don't have an account? <a href="/register" class="text-decoration-none">Create account</a></div>
          </form>
        </div>
      </div>
    </div>

    <!-- 🍞 UNIVERSAL DYNAMIC TOAST SYSTEM -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
      <div id="liveToast" class="toast align-items-center text-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body d-flex align-items-center gap-2">
            <i id="toastIcon" class="fa-solid"></i>
            <span id="toastMessage">Processing...</span>
          </div>
          <button type="button" class="btn-close btn-close-white m-auto me-2" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  
  const alertBox = document.getElementById("loginAlert");
  
  // Reset alert states
  alertBox.classList.add("d-none");
  alertBox.classList.remove("alert-danger", "alert-success");
  
  const payload = {
    email: document.getElementById("loginEmail").value.trim(),
    password: document.getElementById("loginPassword").value
  };

  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (response.ok) {
      // Configure alert as success container
      alertBox.textContent = result.message || "Login successful! Redirecting...";
      alertBox.classList.remove("d-none");
      alertBox.classList.add("alert-success");
      
      // Save secure data to browser structures
      localStorage.setItem("user_access_token", result.access_token);
      document.cookie = `user_access_token=${result.access_token}; path=/; max-age=7200; SameSite=Strict;`;
      
      // Redirect after 2.5 seconds
      setTimeout(() => {
        window.location.href = "/"; 
      }, 2500);
    } else {
      throw new Error(result.detail || "Invalid login credentials.");
    }
  } catch (error) {
    // Configure alert as error container
    alertBox.textContent = error.message;
    alertBox.classList.remove("d-none");
    alertBox.classList.add("alert-danger");
  }
});
    </script>
  </body>
</html>
