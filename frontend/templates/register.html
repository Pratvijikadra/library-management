<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    

<div class="row justify-content-center mt-5">
  <div class="col-md-3">
    <div class="card p-4 border shadow-sm">
      <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-user-plus text-success me-2"></i>Create Account</h3>
      <div id="signupAlert" class="alert alert-danger d-none py-2 small"></div>
      <form id="signupForm" class="smart-form">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" id="signupUser" class="form-control" required placeholder="Enter Your Name" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email address</label>
          <input type="email" id="signupEmail" class="form-control" required placeholder="Enter Your Email" pattern="^[a-zA-Z0-9._%+-]+@(gmail|yahoo|outlook|hotmail|icloud)\.(com|net|org)$" title="Please enter a valid email " />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="signupPassword" class="form-control" required placeholder="Enter password" />
        </div>
        <button type="submit" class="btn btn-success w-100 btn-lg mb-3 submit-lock-btn">Register</button>
        <div class="text-center small text-muted">Already have an account? <a href="/login" class="text-decoration-none">Login here</a></div>
      </form>
    </div>
  </div>
</div>





<script>
  // Dynamic UI feedback handler function mapping Toast system states
 

  // Intercepting account submission payload sequence
// Intercepting account submission payload sequence
document.getElementById("signupForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  
  const alertBox = document.getElementById("signupAlert");
  
  // Reset alert box states before starting a new request
  alertBox.classList.add("d-none");
  alertBox.classList.remove("alert-danger", "alert-success");
  
  const payload = {
    name: document.getElementById("signupUser").value.trim(),
    email: document.getElementById("signupEmail").value.trim(),
    password: document.getElementById("signupPassword").value
  };

  try {
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (response.ok) {
      // 1. Configure the alert box as a success container
      alertBox.textContent = result.message || "Account registered successfully! Redirecting...";
      alertBox.classList.remove("d-none");
      alertBox.classList.add("alert-success");
      
      // 2. Clear input fields for a cleaner UX
      document.getElementById("signupForm").reset();
      
      // Exact 2.5 seconds timeout trigger sequence before relocation routing
      setTimeout(() => {
        window.location.href = "/login";
      }, 2500);
    } else {
      throw new Error(result.detail || "Account registration encountered an error.");
    }
  } catch (error) {
    // Configure the alert box as an error container
    alertBox.textContent = error.message;
    alertBox.classList.remove("d-none");
    alertBox.classList.add("alert-danger");
  }
});
</script>

</body>
</html>
