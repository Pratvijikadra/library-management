<!DOCTYPE html>
<html lang="en">
<head>
    <title>Two-Factor Auth Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 400px; border-radius: 12px;">
        <h4 class="fw-bold mb-2 text-center">Identity Verification</h4>
        
        <!-- Success/Info Notification Banner -->
        {% if message %}
        <div class="alert alert-success py-2 small text-center">{{ message }}</div>
        {% endif %}
        
        <!-- Error Banner Configuration -->
        {% if error %}
        <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}
        
        <form action="/admin/verify-otp" method="POST" class="mt-3">
            <div class="mb-3">

                <input type="text" name="otp_input" class="form-control text-center letter-spacing-2" maxlength="6" pattern="\d{6}" required placeholder="Enter 6-Digit Security OTP" autofocus>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-medium">Confirm & Unlock System</button>
        </form>
    </div>
</body>
</html>
