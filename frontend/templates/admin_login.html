<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 400px; border-radius: 12px;">
        <h4 class="fw-bold mb-3 text-center">Admin Login</h4>
        
        <!-- Error Banner Configuration -->
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        
        <form action="/admin/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="Enter Email">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter Password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Send OTP</button>
        </form>
    </div>
</body>
</html>
